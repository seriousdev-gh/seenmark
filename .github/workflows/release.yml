name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/seen.exe, target/release/seenmark.dll dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "SeenMark-$ver.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: SeenMark-*.zip
          generate_release_notes: true
